# Spell checking with https://github.com/crate-ci/typos
[files]
extend-exclude = [
  # Submodules and data files
  "jablib/src/main/abbrv.jabref.org/",
  "jablib/src/main/resources/csl-styles/",
  "jablib/src/main/resources/csl-locales/",
  "jabgui/src/main/themes.jabref.org/",
  "jablib/src/main/resources/ltwa/",
  "jablib/src/main/resources/icore/",
  "*.terms",
  "reachability-metadata.json",
  # Translations are maintained at Crowdin
  "JabRef_*.properties",
  "**/src/test/resources/",
  "*.bib",
  # Third-party files
  "*.bst",
  "*.xsl",
  "harvard.readme",
  "jablib/src/main/resources/xslt/mathml_latex/README",
  "jablib/src/main/resources/resource/layout/din1505/README.txt",
  "org.citationstyles.*.txt",
  # Keys defined by Eclipse
  "config/*Code Style*",
  # Diagrams (SVG generated from BPMN)
  "docs/images/",
]

[default.extend-words]
# BibTeX field name
annote = "annote"
# "and" separators in BibTeX author lists
