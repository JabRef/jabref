name: Rerun PR merge conflicts check

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - '.github/workflows/rerun-merge-conflict-check.yml'
  workflow_dispatch:

jobs:
  rerun:
    if: github.repository == 'JabRef/jabref'
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: jq
          version: 1.0
      - name: Trigger "On PR opened/updated" for all open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -x
          workflow_name="On PR opened/updated"

          gh pr list --state open --json number --jq '.[] | "\(.number)"' |
          while read pr; do
            echo "Triggering '$workflow_name' for PR #$pr"
            gh workflow run "$workflow_name" --ref main --field pr_number="$pr"
            echo "Triggered '$workflow_name' for PR [#$pr](https://github.com/JabRef/jabref/pull/$pr)" >> $GITHUB_STEP_SUMMARY
            sleep 3
          done
