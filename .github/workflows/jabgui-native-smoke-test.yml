name: JabGui Native Smoke Test

on:
  push:
    branches:
      - main
      - main-release
      - stable
    paths:
      - 'jabgui/**'
      - 'jablib/**'
      - '!jablib/src/test/**'
      - 'build-logic/**'
      - 'versions/**'
      - '.github/workflows/jabgui-native-smoke-test.yml'
  pull_request:
    paths:
      - 'jabgui/**'
      - 'jablib/**'
      - '!jablib/src/test/**'
      - 'build-logic/**'
      - 'versions/**'
      - '.github/workflows/jabgui-native-smoke-test.yml'
  merge_group:
  workflow_dispatch:
    inputs:
      upload-as-artifact:
        description: "Upload the native binary as a workflow artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  native-smoke-test:
    runs-on: ubuntu-22.04
    name: ubuntu-22.04 JabGui native smoke test
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: 'true'
          show-progress: 'false'

      - uses: ./.github/actions/setup-gradle

      # GraalVM CE 25.0.x is not enough: on macOS AWT cannot load libawt, and Lucene needs
      # Arena.ofShared, which only the 25.3 line enables by default.
      - name: Set up GraalVM CE 25.3
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: 'graalvm-community'
          version: '25.3'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # StaticFX links JavaFX statically, so native-image needs the GTK/X11/GL development libraries.
      # xvfb and imagemagick are for running the binary and taking a screenshot.
      - name: Install JavaFX link libraries, Xvfb and ImageMagick
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libgtk-3-dev libxtst-dev libxxf86vm-dev libgl-dev xvfb imagemagick
          version: 1.0

      - name: Build JabGui native binary
        run: gradle :jabgui:nativeCompile

      - name: Run JabGui native smoke test
        run: |
          out="$RUNNER_TEMP/smoke"
          mkdir -p "$out" "$RUNNER_TEMP/jabref-home"
          cp jablib/src/test/resources/testbib/complex.bib "$out/complex.bib"
          log="$out/jabref.log"

          # Fresh HOME: first launch, no preferences, no keyring
          HOME="$RUNNER_TEMP/jabref-home" xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            bash -c '
              "$0" -Dprism.order=sw "$1" > "$2" 2>&1 &
              pid=$!
              sleep 60
              import -window root "$3"
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "JabRef exited before the screenshot"
                exit 1
              fi
              kill "$pid"; sleep 5; kill -9 "$pid" 2>/dev/null || true
            ' "$GITHUB_WORKSPACE/jabgui/build/native/nativeCompile/jabref" "$out/complex.bib" "$log" "$out/screenshot.png"

          cat "$log"
          grep -q "Starting JabRef" "$log" || { echo "JabRef did not start"; exit 1; }
          if grep -E "^ERROR:|NoClassDefFoundError|NoSuchMethodError|UnsatisfiedLinkError|MissingReflectionRegistrationError|MissingJNIRegistrationError|MissingResourceRegistrationError|Fatal error" "$log"; then
            echo "Found errors in the JabRef log"
            exit 1
          fi

      # OculiX downloads its engine jar (~160 MB) to ~/.oculix on first use
      - name: Cache OculiX engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.oculix
          key: oculix-1.0.0

      - name: Install OculiX
        run: pip install oculix==1.0.0

      # Automated screenshots of the main views (JabRef/jabref#6089), driven by OculiX like a user
      - name: Take screenshots
        run: |
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$out" "$RUNNER_TEMP/jabref-home-screenshots"
          cp jablib/src/test/resources/testbib/complex.bib "$out/complex.bib"

          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            bash -c '
              HOME="$4" "$0" -Dprism.order=sw "$1" > "$2/jabref.log" 2>&1 &
              pid=$!
              sleep 60
              python3 "$3" "$2"
              status=$?
              kill "$pid"; sleep 5; kill -9 "$pid" 2>/dev/null || true
              exit $status
            ' "$GITHUB_WORKSPACE/jabgui/build/native/nativeCompile/jabref" "$out/complex.bib" "$out" \
              "$GITHUB_WORKSPACE/jabgui/src/test/nativeimage/jabgui-screenshots.py" "$RUNNER_TEMP/jabref-home-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jabgui-screenshots
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: warn

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jabgui-native-smoke-test
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn

      - name: Upload JabGui native binary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload-as-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jabgui-native-linux
          path: jabgui/build/native/nativeCompile/
          if-no-files-found: error
