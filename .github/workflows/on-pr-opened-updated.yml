name: On PR opened/updated

on:
  # _target is required
  pull_request_target:
  # default: opened, synchronize, reopened

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true

jobs:
  conflicts_with_target:
    if: github.repository == 'JabRef/jabref'
    name: Conflicts with target branch
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          show-progress: 'false'
      # A human push invalidates the bot's earlier approval; "automerge" must be granted again explicitly.
      # The merge commit pushed by this workflow (as jabref-machine) is exempt, as it does not change the PR's content.
      - name: Remove automerge label on push
        if: github.event.action == 'synchronize' && github.event.sender.login != 'jabref-machine'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label automerge
      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -ex
          # approved_automerge is read before the merge commit below is pushed: that push may dismiss the approval.
          gh pr view "$PR_NUMBER" --json headRefName,headRepositoryOwner,headRepository,baseRefName,maintainerCanModify,reviewDecision,autoMergeRequest \
            --jq '"head_ref=\(.headRefName)\nhead_repo=\(.headRepositoryOwner.login)/\(.headRepository.name)\nbase_ref=\(.baseRefName)\nmaintainer_can_modify=\(.maintainerCanModify)\napproved_automerge=\(.reviewDecision == "APPROVED" and .autoMergeRequest != null)"' \
            >> $GITHUB_OUTPUT
      - name: Check PR mergeability
        id: check_mergeable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -exo pipefail

          echo "Checking PR [#$PR_NUMBER](https://github.com/JabRef/jabref/pull/$PR_NUMBER)" >> $GITHUB_STEP_SUMMARY

          # Retry a few times until mergeable != UNKNOWN
          # See https://github.com/cli/cli/discussions/8020#discussioncomment-7057040 for details
          for i in 1 2 3 4 5; do
            MERGEABLE=$(gh pr view "$PR_NUMBER" --json mergeable --template '{{.mergeable}}')
            echo "Attempt $i: $MERGEABLE"
            if [ "$MERGEABLE" != "UNKNOWN" ]; then
              break
            fi
            sleep 5
          done
          echo "Result: $MERGEABLE" >> $GITHUB_STEP_SUMMARY
          echo "mergeable=$MERGEABLE" >> $GITHUB_OUTPUT
          echo "head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" >> $GITHUB_OUTPUT

          if [ "$MERGEABLE" != "CONFLICTING" ]; then
            echo "✅ No merge conflicts"
            echo "✅ No merge conflicts" >> $GITHUB_STEP_SUMMARY
          fi

      # Once the conflict is resolved, drop the old comment (posted as jabref-machine by
      # pr-comment.yml, or as github-actions by the dispatch path below). Otherwise, the next
      # conflict is silently skipped by the "Already commented" check below.
      # Requires an explicit MERGEABLE: after five retries the check may still report UNKNOWN.
      - name: Remove stale conflict comments
        if: steps.check_mergeable.outputs.mergeable == 'MERGEABLE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -exo pipefail
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == "jabref-machine") and (.body | contains("Conflicts with target branch"))) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
            echo "Removed stale conflict comment $id" >> $GITHUB_STEP_SUMMARY
          done

      # In case of a conflict, try to resolve it automatically by merging the PR's base branch
      # (main, or the next lower PR's head branch for a stacked PR):
      # the changelog merge driver resolves conflicts in CHANGELOG.md semantically and lets
      # "git merge" fail on any other conflict - then, nothing is pushed.
      # Thus, a merge commit is pushed if and only if CHANGELOG.md is the only conflicting file.
      # Pushing is possible for branches in JabRef/jabref and for forks allowing maintainer edits.
      # All steps use continue-on-error; if anything fails, the conflict is reported as before.
      - name: Checkout PR head branch
        id: checkout_pr
        if: steps.check_mergeable.outputs.mergeable == 'CONFLICTING' && (steps.pr_info.outputs.head_repo == 'JabRef/jabref' || steps.pr_info.outputs.maintainer_can_modify == 'true')
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pr_info.outputs.head_repo }}
          ref: ${{ steps.pr_info.outputs.head_ref }}
          submodules: 'true'
          fetch-depth: 0
          show-progress: 'false'
          token: ${{ secrets.GH_TOKEN_JABREF_MACHINE_PR_APPROVE || github.token }}
      # Pushes the resolved merge back to the PR branch. This is the whole point:
      # the push triggers a fresh run that then reports no conflicts (no comment).
      # "$/" resolves the action from this workflow's own (trusted) commit, not from the
      # workspace - the workspace holds the untrusted PR head, whose copy of the action
      # must never run with write credentials.
      - name: Merge ${{ steps.pr_info.outputs.base_ref }} into PR branch
        id: automerge
        if: steps.checkout_pr.outcome == 'success'
        continue-on-error: true
        uses: $/.github/actions/merge-upstream-branch
        with:
          target-branch: ${{ steps.pr_info.outputs.head_ref }}
          base-branch: ${{ steps.pr_info.outputs.base_ref }}
      # After the merge, HEAD is the merge commit that was pushed.
      - name: Record pushed merge commit
        id: merge_commit
        if: steps.automerge.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Handle merge conflict
        if: steps.check_mergeable.outputs.mergeable == 'CONFLICTING'
        env:
          AUTOMERGE_OUTCOME: ${{ steps.automerge.outcome }}
          APPROVED_AUTOMERGE: ${{ steps.pr_info.outputs.approved_automerge }}
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          BASE_REF: ${{ steps.pr_info.outputs.base_ref }}
          MERGE_COMMIT: ${{ steps.merge_commit.outputs.sha }}
          PAT: ${{ secrets.GH_TOKEN_JABREF_MACHINE_PR_APPROVE }}
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -ex

          if [ "$AUTOMERGE_OUTCOME" = "success" ]; then
            # CHANGELOG.md was the only conflicting file - the base branch was merged and pushed.
            # No comment: the push triggers a new run, which then reports no conflicts.
            echo "✅ Conflict in CHANGELOG.md only - resolved by merging $BASE_REF" >> $GITHUB_STEP_SUMMARY
            if [ "$APPROVED_AUTOMERGE" = "true" ]; then
              # The pushed merge commit dismisses the approval and thereby stalls auto-merge.
              # The label triggers "On PR labeled", which approves again and re-enables auto-merge.
              # Needs the PAT: label events created with GITHUB_TOKEN do not trigger workflows.
              # "On PR labeled" only approves heads in JabRef/jabref; for forks, the label would be a dead promise.
              if [ "$HEAD_REPO" != "JabRef/jabref" ]; then
                echo "⚠️ Approved fork PR with auto-merge - approval must be renewed manually" >> $GITHUB_STEP_SUMMARY
              elif [ "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" != "$MERGE_COMMIT" ]; then
                # A human commit landed after our push: it is not covered by the approval read above.
                echo "⚠️ PR head moved past the merge commit - not re-approving" >> $GITHUB_STEP_SUMMARY
              else
                # Remove first: the label may still be attached from the original auto-merge request,
                # and re-adding an attached label produces no "labeled" event.
                gh pr edit "$PR_NUMBER" --remove-label automerge
                GH_TOKEN="$PAT" gh pr edit "$PR_NUMBER" --add-label automerge
                echo "✅ Approved PR with auto-merge - added label \"automerge\"" >> $GITHUB_STEP_SUMMARY
              fi
            fi
            exit 0
          fi

          echo "❌ Merge conflicts"
          echo "❌ Merge conflicts" >> $GITHUB_STEP_SUMMARY
          gh issue edit $PR_NUMBER --remove-label "status: ready-for-review" --add-label "status: changes-required"

          # "workflow dispatch" does not trigger subsequent "on completion" runs.
          # Therefore, we emulate ghprcomment here
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Fail closed: a failing "gh api" must abort the step (via set -e), not be
            # swallowed into "no comment found" - which would post a duplicate comment.
            # jq matches the complete workflow-owned marker (a shell grep would either split a
            # multi-line -F pattern into per-line alternatives or loosely match free text quoting
            # the phrase), and only matches reach the file - so xtrace never echoes comment bodies.
            gh api graphql -f query="
                query {
                  repository(owner: \"JabRef\", name: \"JabRef\") {
                    pullRequest(number: $PR_NUMBER) {
                      comments(last: 20) {
                        nodes { body }
                      }
                    }
                  }
                }
              " --jq '.data.repository.pullRequest.comments.nodes[].body | select(test("<!-- ghprcomment\\r?\\nOn PR opened/updated\\r?\\nConflicts with target branch\\r?\\n-->"))' > marker_comments.txt

            if [ -s marker_comments.txt ]; then
              echo "Already commented about conflicts."
              # When triggered by another workflow, success is also if there is a merge conflict
              exit 0;
            fi

            echo "Commenting on PR..."
            # Backticks are escaped: the heredoc is unquoted to expand $BASE_REF, and an
            # unquoted heredoc would otherwise run them as command substitution.
            cat > body.txt <<EOF
          Your pull request conflicts with the target branch.

          Please [merge \`upstream/$BASE_REF\`](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/syncing-a-fork#syncing-a-fork-branch-from-the-command-line) with your code. For a step-by-step guide to resolve merge conflicts, see <https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line>.

          <!-- ghprcomment
          On PR opened/updated
          Conflicts with target branch
          -->
          EOF
            gh issue comment "$PR_NUMBER" --body-file body.txt
            echo "Commented on PR" >> $GITHUB_STEP_SUMMARY

            # When triggered by another workflow, success is also if there is a merge conflict
            exit 0;
          fi;

          exit 1

      # Only if this workflow had flagged a conflict (its comment is the marker), not on every push.
      # "Comment on PR" then does the rest: ghprcomment deletes the conflict comment (no job of this
      # run fails), and the status labels are re-evaluated with the full rule set - other bot
      # comments, active Qodo threads, draft, review decision - instead of duplicating it here.
      - name: Re-evaluate status labels after conflict resolved
        if: steps.check_mergeable.outputs.mergeable == 'MERGEABLE'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ steps.check_mergeable.outputs.head_sha }}
        run: |
          set -exo pipefail
          # jq matches the complete workflow-owned marker, per page of the paginated response
          # (a shell grep would either split a multi-line -F pattern into per-line alternatives
          # or loosely match free text quoting the phrase).
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body | select(test("<!-- ghprcomment\\r?\\nOn PR opened/updated\\r?\\nConflicts with target branch\\r?\\n-->"))' > marker_comments.txt
          if [ -s marker_comments.txt ]; then
            gh workflow run "Comment on PR" --ref main --field pr_number="$PR_NUMBER" --field workflow_run_id="$GITHUB_RUN_ID" --field head_sha="$HEAD_SHA"
          fi
