name: Check PR Format

on:
  # _target to run even in the case of merge conflicts
  pull_request_target:
    types: [ opened, reopened, edited, synchronize, ready_for_review ]

permissions:
  contents: read
  pull-requests: read

jobs:
  check_title_format:
    name: PR title must not contain "issue <number>"
    if: >
      (github.event.pull_request.head.repo.full_name != 'JabRef/jabref') &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    runs-on: ubuntu-slim
    steps:
      - name: Check PR title
        run: |
          TITLE=$(gh pr view "${{ github.event.number }}" --json title --template '{{.title}}')
          echo "Title: $TITLE"

          if echo "$TITLE" | grep -Eiq 'issue ?#?[0-9]+.+'; then
            echo "❌ Title contains 'issue <number>' — not allowed."
            exit 1
          fi

          echo "✅ Title format OK"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  no-html-comments:
    if: >
      (github.event.pull_request.head.repo.full_name != 'JabRef/jabref') &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: No HTML comments
    runs-on: ubuntu-slim
    steps:
      - name: Check for existence of section "Checklist"
        id: check_mandatory_section
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}')

          if echo "$BODY" | grep -q "<!--"; then
            echo "❌ HTML comments present"
            exit 1
          else
            echo "✅ No HTML comments found"
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  mandatory-checks-section-exists:
    if: >
      (github.event.pull_request.head.repo.full_name != 'JabRef/jabref') &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: Mandatory Checklist present
    runs-on: ubuntu-slim
    steps:
      - name: Check for existence of section "Checklist"
        id: check_mandatory_section
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}')

          if echo "$BODY" | grep -q "### Checklist"; then
            echo "✅ '### Checklist' section found."
          else
            echo "❌ '### Checklist' section is missing!"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  checklist-checked:
    if: >
      (github.event.pull_request.head.repo.full_name != 'JabRef/jabref') &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: PR checklist OK
    runs-on: ubuntu-slim
    needs: [ mandatory-checks-section-exists ]
    steps:
      - name: Check for PR checklist
        id: check_changelog_modification
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}' | grep -A20 '### Checklist')
          echo "Found body: $BODY"

          BOXES=$(printf '%s\n' "$BODY" | grep "^- \[")
          echo "Found boxes: $BOXES"

          while IFS= read -r line; do
              if ! printf '%s\n' "$line" | grep -Eq "^- \[(x|/| )\] "; then
                  echo "❌ Found improperly formatted checkbox: '$line'"
                  exit 1
              fi
          done <<< "$BOXES"

          LINE_COUNT=$(echo "$BOXES" | wc -l)

          if [ "$LINE_COUNT" -ne 7 ]; then
            echo "❌ Found $LINE_COUNT lines instead of 7 required lines"
            exit 1
          fi

          echo "✅ All checkboxes are present and in the correct format."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  ai-usage-level:
    if: >
      (github.event.pull_request.head.repo.full_name != 'JabRef/jabref') &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: AI usage level declared
    runs-on: ubuntu-slim
    steps:
      - name: Check for AIL tag in section "AI usage"
        run: |
          set -e

          # HTML comments of the template mention AIL tags as examples - ignore them
          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}' | perl -0pe 's/<!--.*?-->//gs')
          SECTION=$(printf '%s\n' "$BODY" | sed -n '/^### AI usage/,/^### Checklist/p')
          AIL=$(printf '%s\n' "$SECTION" | grep -oE '\bAIL[0-9]\b' | head -1 || true)

          case "$AIL" in
            AIL[0-4]) echo "✅ $AIL declared." ;;
            "") echo "❌ No AI Influence Level (AIL0–AIL4) declared in section 'AI usage'."; exit 1 ;;
            *) echo "❌ $AIL declared: fully AI-generated pull requests are not accepted."; exit 1 ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  ai-usage-disclosed:
    if: >
      (github.event.pull_request.head.repo.full_name != 'JabRef/jabref') &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: AI usage disclosed
    runs-on: ubuntu-slim
    steps:
      - name: Check that AI traces come with a disclosure
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}' | perl -0pe 's/<!--.*?-->//gs')
          TRAILERS=$(gh pr view "${{ github.event.number }}" --json commits --jq '.commits[].messageBody' \
            | grep -iE '^Co-Authored-By:.*(claude|anthropic|copilot|chatgpt|openai|codex|gemini|cursor|junie|devin|aider|windsurf)' || true)

          if [ -z "$TRAILERS" ] && ! printf '%s' "$BODY" | grep -q '🤖'; then
            echo "✅ No AI traces found."
            exit 0
          fi
          echo "AI traces found:"
          printf '%s\n' "$TRAILERS"

          SECTION=$(printf '%s\n' "$BODY" | sed -n '/^### AI usage/,/^### Checklist/p')
          if printf '%s\n' "$SECTION" | grep -qE '^_{3,}\s*$' || printf '%s\n' "$SECTION" | grep -qE '\bAIL0\b'; then
            echo "❌ AI traces found, but section 'AI usage' is empty or claims AIL0."
            exit 1
          fi
          echo "✅ AI usage disclosed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  upload-pr-number:
    runs-on: ubuntu-slim
    steps:
      - name: Create pr_number.txt
        run: echo "${{ github.event.number }}" > pr_number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pr_number
          path: pr_number.txt
