name: Check PR Format

on:
  # _target to run even in the case of merge conflicts
  pull_request_target:
    types: [ opened, reopened, edited, synchronize, ready_for_review ]

permissions:
  contents: read
  pull-requests: read

jobs:
  check_title_format:
    name: PR title describes the change
    if: >
      (github.event.pull_request.head.repo.full_name != github.repository) &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    runs-on: ubuntu-slim
    steps:
      - name: Check PR title
        run: |
          TITLE=$(gh pr view "${{ github.event.number }}" --json title --template '{{.title}}')
          echo "Title: $TITLE"

          # Matches "issue 123", "issue-123", "issue_#123", "Fix for #123", "fix-for-issue-123", "Resolves #123", ...
          if echo "$TITLE" | grep -Eiq 'issue[-_ ]?#?[0-9]+|(fix(es|ed)?|resolve[sd]?|close[sd]?)[-_ ]?(for[-_ ]?)?#[0-9]+'; then
            echo "❌ Title references an issue number instead of describing the change — not allowed."
            exit 1
          fi

          # A title without any whitespace is a single word or a branch name (e.g., "fix-for-issue-123") — not a description
          if ! echo "$TITLE" | grep -q '[[:space:]]'; then
            echo "❌ Title looks like a branch name or a single word instead of describing the change — not allowed."
            exit 1
          fi

          echo "✅ Title format OK"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  no-html-comments:
    if: >
      (github.event.pull_request.head.repo.full_name != github.repository) &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: No HTML comments
    runs-on: ubuntu-slim
    steps:
      - name: Check for existence of section "Checklist"
        id: check_mandatory_section
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}')

          if echo "$BODY" | grep -q "<!--"; then
            echo "❌ HTML comments present"
            exit 1
          else
            echo "✅ No HTML comments found"
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  mandatory-checks-section-exists:
    if: >
      (github.event.pull_request.head.repo.full_name != github.repository) &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot')
      )
    name: Mandatory Checklist present
    runs-on: ubuntu-slim
    steps:
      - name: Check for existence of section "Checklist"
        id: check_mandatory_section
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}')

          if echo "$BODY" | grep -q "### Checklist"; then
            echo "✅ '### Checklist' section found."
          else
            echo "❌ '### Checklist' section is missing!"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  checklist-checked:
    if: >
      (github.event.pull_request.head.repo.full_name != github.repository) &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot') ||
        (
          startsWith(github.event.pull_request.title, '[Bot] ') ||
          startsWith(github.event.pull_request.title, 'Bump ') ||
          startsWith(github.event.pull_request.title, 'New Crowdin updates') ||
          startsWith(github.event.pull_request.title, 'Update Gradle Wrapper from')
        )
      )
    name: PR checklist OK
    runs-on: ubuntu-slim
    needs: [ mandatory-checks-section-exists ]
    steps:
      - name: Check for PR checklist
        id: check_changelog_modification
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}' | grep -A20 '### Checklist')
          echo "Found body: $BODY"

          BOXES=$(printf '%s\n' "$BODY" | grep "^- \[")
          echo "Found boxes: $BOXES"

          while IFS= read -r line; do
              if ! printf '%s\n' "$line" | grep -Eq "^- \[(x|/| )\] "; then
                  echo "❌ Found improperly formatted checkbox: '$line'"
                  exit 1
              fi
          done <<< "$BOXES"

          LINE_COUNT=$(echo "$BOXES" | wc -l)

          if [ "$LINE_COUNT" -ne 7 ]; then
            echo "❌ Found $LINE_COUNT lines instead of 7 required lines"
            exit 1
          fi

          echo "✅ All checkboxes are present and in the correct format."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  license-checked:
    if: >
      (github.event.pull_request.head.repo.full_name != github.repository) &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !(
        (github.event.pull_request.user.login == 'dependabot[bot]') || (github.event.pull_request.user.login == 'renovate-bot')
      )
    name: MIT license confirmed
    runs-on: ubuntu-slim
    steps:
      - name: Check that the MIT license checkbox is ticked
        run: |
          set -e

          BODY=$(gh pr view "${{ github.event.number }}" --json body --template '{{.body}}')

          if ! CHECKLIST=$(printf '%s\n' "$BODY" | awk '
            /^### Checklist[[:space:]]*$/ { found = 1; in_checklist = 1; next }
            /^#+ / { in_checklist = 0 }
            in_checklist { print }
            END { if (!found) exit 1 }
          '); then
            echo "❌ The Checklist section is missing."
            exit 1
          fi

          LICENSE_LINES=$(printf '%s\n' "$CHECKLIST" | grep -E "^- \[.\] I own the copyright of the code submitted and I license it under the \[MIT license\]" || true)

          if [ -n "$LICENSE_LINES" ]; then
            LICENSE_COUNT=$(printf '%s\n' "$LICENSE_LINES" | wc -l | tr -d '[:space:]')
          else
            LICENSE_COUNT=0
          fi

          if [ "$LICENSE_COUNT" -ne 1 ]; then
            echo "❌ Expected exactly one MIT license checkbox, found $LICENSE_COUNT."
            exit 1
          fi

          echo "Found license line: $LICENSE_LINES"

          if ! printf '%s\n' "$LICENSE_LINES" | grep -q "^- \[x\] "; then
            echo "❌ The MIT license checkbox must be ticked ([x]). We cannot accept code without the permission to license it under MIT."
            exit 1
          fi

          echo "✅ MIT license confirmed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  upload-pr-number:
    runs-on: ubuntu-slim
    steps:
      - name: Create pr_number.txt
        run: echo "${{ github.event.number }}" > pr_number.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr_number
          path: pr_number.txt
