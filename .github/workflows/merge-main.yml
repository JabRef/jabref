name: Merge main

permissions:
  contents: write
  pull-requests: read

on:
  pull_request:
    paths:
      - '.github/workflows/merge-main.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to merge main into'
        required: true
        type: number

concurrency:
  # inputs.pr first: on workflow_dispatch, head_ref is empty and ref is just the workflow's
  # ref, so every dispatch would share one group and cancel the previous PR's run.
  group: "${{ github.workflow }}-${{ inputs.pr || github.head_ref || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  merge-main:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'JabRef/jabref'
    runs-on: ubuntu-latest

    steps:
      # Resolve the PR head repo and branch for BOTH triggers. On pull_request the PR may
      # come from a fork, so we must check out the head repo, not github.repository (the base) -
      # otherwise the head branch does not exist in the checked-out repo and checkout fails.
      - name: Resolve PR head repo and branch
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_JABREF_MACHINE_PR_APPROVE || github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName,headRepositoryOwner,headRepository \
              --jq '"branch=\(.headRefName)\nrepo=\(.headRepositoryOwner.login)/\(.headRepository.name)"' >> "$GITHUB_OUTPUT"
          else
            echo "branch=$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "repo=$PR_HEAD_REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          submodules: 'true'
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.branch }}
          token: ${{ secrets.GH_TOKEN_JABREF_MACHINE_PR_APPROVE || github.token }}

      # The PR may live in a fork ("repository" above); always merge main of JabRef/jabref
      - name: Fetch upstream main
        run: |
          set -ex
          git remote add upstream "https://github.com/JabRef/jabref.git" || true
          git fetch upstream main

      # The workspace holds the PR head (possibly a fork), so a local "uses: ./..." would
      # execute the PR's copy of the action with write credentials. Take the action's code
      # from the trusted revision this workflow itself runs from instead.
      - name: Checkout trusted merge action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted-actions
          sparse-checkout: .github/actions/merge-upstream-main
          persist-credentials: 'false'
          show-progress: 'false'

      # Pushes the merge commit back to the PR branch (the reason this workflow exists).
      - name: Merge main
        uses: ./trusted-actions/.github/actions/merge-upstream-main
        with:
          target-branch: ${{ steps.resolve.outputs.branch }}
