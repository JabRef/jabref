name: Adapt PR status labels (Move)

on:
  workflow_run:
    workflows: [ "Adapt PR status labels (Check)" ]
    types: [ completed ]

jobs:
  apply-labels:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download artifact from triggering run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: pr_number
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Check for pr_number.txt
        id: check
        run: |
          if [ -f pr_number.txt ]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
            echo "pr_number=$(cat pr_number.txt)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "No PR number existing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply label operations
        if: steps.check.outputs.continue == 'true'
        shell: bash -euxo pipefail {0}
        run: |
          # The PR number comes from an artifact the triggering (untrusted) run wrote: pass it via env
          # and accept digits only, so it can never be expanded into the shell as code.
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number: $PR_NUMBER"; exit 1; }
          gh issue --repo "$GITHUB_REPOSITORY" edit "$PR_NUMBER" --remove-label "status: ready-for-review,status: awaiting-second-review,status: to-be-merged" --add-label "status: changes-required"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check.outputs.pr_number }}
