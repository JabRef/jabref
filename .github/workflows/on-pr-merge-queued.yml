name: Label merge-queue PR

on:
  merge_group:

jobs:
  label:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: 'Replace review-ready labels "status: to-be-merged"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^gh-readonly-queue/[^/]+/pr-([0-9]+)- ]]; then
            pr="${BASH_REMATCH[1]}"
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "status: ready-for-review" --remote-label "status: awaiting-second-review" --add-label "status: to-be-merged"
          else
            echo "Cannot extract PR number from ref: $ref" >&2
            exit 1
          fi
  # A PR ejected from the queue (failed check, manual removal) is keeping its "status: to-be-merged" label, because the investigation is different than a functionality review
