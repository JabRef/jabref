# Description: This workflow is triggered when the "Check" workflow completes.
# Since this pull request has write permissions on the target repo, we should **NOT** execute any untrusted code.
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
# Based on https://github.com/spring-projects/spring-security/pull/15477/files

name: Comment on PR

on:
  workflow_run:
    # Review activity (Qodo submitting a review, the PR author replying in a thread) is relevant
    # too, but its pull_request_review* runs are unprivileged on fork PRs - "PR Review Activity"
    # bridges them into this list.
    # note when updating via a PR and testing - `workflow_run` executes from the `main` branch and not the PR branch
    workflows: [ "Source Code Tests", "On PR opened/updated", "Check PR Format", "Link PR to Issue", "Check PR Modifications", "Check PR CHANGELOG.md", "PR Review Activity" ]
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    types: [ completed ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
      workflow_run_id:
        description: 'Workflow run id'
        required: true
      head_sha:
        description: 'PR head SHA the dispatching run evaluated; the run does nothing if the PR moved on or conflicts again'
        required: false

jobs:
  comment:
    if: ${{ github.repository == 'JabRef/jabref' }}
    # The label decision reads live review-thread state and writes it back minutes later, so two
    # runs for the same PR would race and the slower one would restore the state it started from.
    # The PR number is only known after the artifact is read, too late for a group expression -
    # head repository plus head branch identifies the same pull request just as well.
    concurrency:
      group: pr-comment-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.event.inputs.pr_number }}
      # The newest run has the freshest view; an interrupted run's work is redone by the one
      # that replaced it.
      cancel-in-progress: true
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Show GitHub context
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          WORKFLOW_RUN_ID: ${{ github.event.inputs.workflow_run_id }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "PR_NUMBER=${PR_NUMBER}"
          echo "WORKFLOW_RUN_ID=${WORKFLOW_RUN_ID}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "WORKFLOW=${WORKFLOW}"
          echo "RUN_ID=${RUN_ID}"
          echo "RUN_NUMBER=${RUN_NUMBER}"
          echo "Workflow $WORKFLOW" >> $GITHUB_STEP_SUMMARY

      - name: Download PR number
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: pr_number
          path: ${{ runner.temp }}/pr-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read pr_number.txt
        if: ${{ github.event_name == 'workflow_run' }}
        id: read-pr_number
        run: |
          ARTIFACT_FILE="${{ runner.temp }}/pr-artifacts/pr_number.txt"
          if [ ! -f "$ARTIFACT_FILE" ]; then
            echo "No pr_number.txt found in downloaded artifact"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! IFS= read -r PR_NUMBER < "$ARTIFACT_FILE"; then
            echo "Invalid PR number in artifact"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER="${PR_NUMBER%$'\r'}"

          if sed -n '2,$p' "$ARTIFACT_FILE" | grep -q '^'; then
            echo "Invalid PR number in artifact"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number in artifact"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Read PR number $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        # required for gh tool and .github/ghprcomment.yml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          show-progress: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: jq
          version: 1.0
      - name: Is PR from forked?
        if: ${{ github.event_name == 'workflow_run' && steps.read-pr_number.outputs.pr_number != '' }}
        id: isCrossRepository
        run: |
          isCrossRepository=$(gh pr view $pr_number --json isCrossRepository --jq '.isCrossRepository')
          echo "Got isCrossRepository $isCrossRepository"
          echo isCrossRepository=$isCrossRepository >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          pr_number: ${{ steps.read-pr_number.outputs.pr_number }}

      # Set a common variable for PR number and workflow_run_id from either event.
      - name: Set variables
        if: ${{ github.event_name == 'workflow_dispatch' || steps.read-pr_number.outputs.pr_number != '' }}
        id: set-vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "workflow_run_id=${{ github.event.inputs.workflow_run_id }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ steps.read-pr_number.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "workflow_run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

      - name: "Check if PR has 'dev: no-bot-comments' label"
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        id: check-label
        run: |
          has_label=$(gh pr view "${{ steps.set-vars.outputs.pr_number }}" --json labels -q \
            '.labels[].name' | grep -Fxq "dev: no-bot-comments" && echo "true" || echo "false")
          echo "has_label=$has_label" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No setup-gradle here: this job never runs Gradle, it only needs a JDK and JBang.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.check-label.outputs.has_label == 'false' && steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Generate JBang cache key
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.check-label.outputs.has_label == 'false' && steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        id: cache-key
        run: echo "cache_key=jbang-ghprcomment-$(date +%Y-%m)" >> $GITHUB_OUTPUT
      - name: Cache JBang
        # Own key: ghprcomment pulls different dependencies than the other JBang jobs.
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.check-label.outputs.has_label == 'false' && steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.jbang
          key: ${{ steps.cache-key.outputs.cache_key }}
          restore-keys:
            jbang-ghprcomment-
      - name: Resolve //DEPS into the cached directory
        # JBang resolves script dependencies into ~/.m2, which is not cached here.
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.check-label.outputs.has_label == 'false' && steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        run: echo "JBANG_REPO=$HOME/.jbang/repository" >> "$GITHUB_ENV"
      - name: Setup JBang
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.check-label.outputs.has_label == 'false' && steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1

      - name: ghprcomment@main
        if: ${{ github.event_name == 'workflow_dispatch' || (steps.check-label.outputs.has_label == 'false' && steps.read-pr_number.outputs.pr_number != '' && steps.isCrossRepository.outputs.isCrossRepository == 'true' && github.event.workflow_run.name != 'PR Review Activity') }}
        run: |
          # A dispatched cleanup runs asynchronously; a newer push may have made the PR conflicting
          # again in the meantime, and a stale run must not remove that conflict's comment or labels.
          # Checked here, right before mutating, so the setup steps above leave no stale-check window.
          # Fail closed: only a confirmed MERGEABLE state at the dispatched head SHA may proceed.
          if [ -n "$HEAD_SHA" ]; then
            # Retry a few times until mergeable != UNKNOWN
            # See https://github.com/cli/cli/discussions/8020#discussioncomment-7057040 for details
            for i in 1 2 3 4 5; do
              PR=$(gh pr view "$PR_NUMBER" --json headRefOid,mergeable)
              MERGEABLE=$(jq -r .mergeable <<< "$PR")
              if [ "$MERGEABLE" != "UNKNOWN" ]; then break; fi
              sleep 5
            done
            if [ "$(jq -r .headRefOid <<< "$PR")" != "$HEAD_SHA" ] || [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "⊘ PR moved on since dispatch - skipping" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
          fi
          jbang trust add https://github.com/koppor/ghprcomment/blob/main/ghprcomment.java
          jbang https://github.com/koppor/ghprcomment/blob/main/ghprcomment.java -r JabRef/jabref -p ${{ steps.set-vars.outputs.pr_number }} -w ${{ steps.set-vars.outputs.workflow_run_id }}
        env:
          GITHUB_OAUTH: ${{ secrets.GH_TOKEN_JABREF_MACHINE_PR_APPROVE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.set-vars.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}

      - name: 'Adapt label "status: changes-required"'
        # Every workflow in this workflow's workflow_run trigger list is a label-relevant producer:
        # the pending guard below defers evaluation to whichever of them finishes last, so each of
        # their completion events must be allowed to run this step - not only Source Code Tests.
        # Deliberately not restricted to fork PRs (unlike ghprcomment, which only forks need):
        # labels are computed nowhere else, and with the restriction a same-repo PR whose Qodo
        # review arrived while a check was still running never got a second chance to be labelled.
        if: ${{ github.event_name == 'workflow_dispatch' || steps.read-pr_number.outputs.pr_number != '' }}
        run: |
          # Same stale-dispatch guard as in ghprcomment@main above, re-checked immediately before
          # this step's own mutations (ghprcomment may have run for a while in between).
          if [ -n "$HEAD_SHA" ]; then
            for i in 1 2 3 4 5; do
              PR=$(gh pr view "$PR_NUMBER" --json headRefOid,mergeable)
              MERGEABLE=$(jq -r .mergeable <<< "$PR")
              if [ "$MERGEABLE" != "UNKNOWN" ]; then break; fi
              sleep 5
            done
            if [ "$(jq -r .headRefOid <<< "$PR")" != "$HEAD_SHA" ] || [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "⊘ PR moved on since dispatch - skipping" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
          fi

          echo "PR #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY

          REPO="${{ github.repository }}"

          # The labels reflect the complete picture only once every producer of bot comments is done.
          # Whatever is still pending re-triggers this workflow when it finishes (workflow_run for the
          # workflows below, "PR Review Activity" for Qodo), so skipping here loses nothing.
          PENDING=$(gh pr checks --repo $REPO $PR_NUMBER --json state,workflow \
            --jq '[.[] | select(.state == "IN_PROGRESS" or .state == "QUEUED" or .state == "PENDING")
                        | select(.workflow == "Source Code Tests" or .workflow == "On PR opened/updated" or .workflow == "Check PR Format"
                                 or .workflow == "Link PR to Issue" or .workflow == "Check PR Modifications" or .workflow == "Check PR CHANGELOG.md")
                        | .workflow] | unique | join(", ")')
          if gh api repos/$REPO/issues/$PR_NUMBER/comments --paginate \
               --jq '.[] | select(.user.login == "qodo-free-for-open-source-projects[bot]") | .body' \
             | grep -q "Qodo is busy working"; then
            PENDING="${PENDING:+$PENDING, }Qodo"
          fi
          if [ -n "$PENDING" ]; then
            echo "⏳ Still pending: $PENDING - labels are evaluated when the last one finishes"
            echo "⏳ Still pending: $PENDING - labels are evaluated when the last one finishes" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          COMMENTS=$(gh api \
            repos/$REPO/issues/$PR_NUMBER/comments \
            --jq '.[] | select(.user.login=="jabref-machine")')

          # Qodo comments in review threads (not issue comments); a thread counts as long as it is
          # active (not resolved, not outdated) and the PR author has not replied to it
          QODO_THREADS=$(gh api graphql \
            -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F pr="$PR_NUMBER" \
            -f query='
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    author { login }
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        isOutdated
                        comments(first: 100) { nodes { author { login } } }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest as $pr
              | [ $pr.reviewThreads.nodes[]
                  | select((.isResolved or .isOutdated) | not)
                  | [.comments.nodes[].author.login // ""]
                  | select(.[0] == "qodo-free-for-open-source-projects")
                  | select([.[1:][] | select(. == $pr.author.login)] == [])
                ] | length')

          if [[ -n "$COMMENTS" || "$QODO_THREADS" -gt 0 ]]; then
            echo "Bot comments - adding label changes-required"
            gh issue --repo $REPO edit $PR_NUMBER --remove-label "status: ready-for-review,status: stale" --add-label "status: changes-required"
            echo "Bot comments - added label changes-required" >> $GITHUB_STEP_SUMMARY
          else
            # A PR without bot comments is ready for review unless it is a draft, a human requested changes,
            # or it already progressed further in the review process. Drafts and pending human re-reviews
            # end up without any status label ("nothing for the bots, a human decides what is next");
            # progressed PRs keep their awaiting-second-review / to-be-merged label.
            PR_STATE=$(gh pr view --repo $REPO $PR_NUMBER --json isDraft,reviewDecision,labels \
              --jq 'if .isDraft or .reviewDecision == "CHANGES_REQUESTED"
                       or ([.labels[].name] | any(. == "status: awaiting-second-review" or . == "status: to-be-merged"))
                    then "not-ready" else "ready" end')
            if [ "$PR_STATE" = "ready" ]; then
              echo "No bot comments and PR is ready for review - adding label ready-for-review"
              gh issue --repo $REPO edit $PR_NUMBER --remove-label "status: changes-required,status: stale" --add-label "status: ready-for-review"
              echo "No bot comments - removed label changes-required and added ready-for-review" >> $GITHUB_STEP_SUMMARY
            else
              echo "No bot comments, but PR is draft, has changes requested, or is already further in review - removing changes-required, stale and ready-for-review"
              gh issue --repo $REPO edit $PR_NUMBER --remove-label "status: changes-required,status: stale,status: ready-for-review"
              echo "No bot comments, but not ready for review - removed changes-required, stale and ready-for-review" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        env:
          # Labels set by the PAT do emit "labeled" events, which is harmless here: the only
          # listener acting on a status label ("Adapt PR status") marks drafts ready for review,
          # and this step never puts "status: ready-for-review" on a draft.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_JABREF_MACHINE_PR_APPROVE }}
          PR_NUMBER: ${{ steps.set-vars.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
