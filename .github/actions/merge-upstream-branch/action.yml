name: "Merge upstream branch"
description: "Merges a branch of JabRef/jabref (the PR's base branch, main by default) into the current branch, resolving CHANGELOG.md conflicts semantically, and pushes the merge commit. The changelog merge driver is run from source via jbang, so driver fixes apply without waiting for a maven-flow/merge release."

inputs:
  target-branch:
    description: "Branch to push the merge commit to"
    required: true
  base-branch:
    description: "Branch of JabRef/jabref to merge - the PR's base branch, which is another PR's head branch for stacked PRs"
    required: false
    default: "main"
  driver-revision:
    description: "Commit of changelog-merge-driver to run (immutable pin; bump explicitly to pick up driver fixes)"
    required: false
    default: "efd607a74d7dc52038e24d4a8994e3c27d6e6818"

runs:
  using: "composite"
  steps:
    # Some runners (e.g. ubuntu-slim) do not provide Java, which jbang needs
    - name: Setup Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup JBang
      uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1

    # Bumping the pin is a cache miss (fresh build); everything else hits.
    - name: Cache JBang
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.jbang
        key: jbang-changelog-merge-driver-${{ inputs.driver-revision }}

    # Runs the fix of https://github.com/maven-flow/changelog-merge-driver/pull/14 from its fork; switch back
    # to maven-flow once that is merged.
    - name: Merge upstream/${{ inputs.base-branch }}
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.target-branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        DRIVER_REVISION: ${{ inputs.driver-revision }}
      run: |
        set -ex
        # The PR head may live in a fork; the base branch always comes from JabRef/jabref
        git remote add upstream "https://github.com/JabRef/jabref.git" || true
        git fetch upstream "$BASE_BRANCH"
        jbang trust add https://github.com/koppor/changelog-merge-driver/
        # Pinned to an immutable commit - never the repo's mutable HEAD/alias - since the
        # driver runs with a push-capable token in this job.
        git config merge.changelog.driver "jbang https://github.com/koppor/changelog-merge-driver/blob/$DRIVER_REVISION/ChangelogMergeDriver.java %A %O %B --rebase"
        # Overrides the checked-in "CHANGELOG.md merge=union" without dirtying the working tree
        echo "CHANGELOG.md merge=changelog" >> "$(git rev-parse --git-dir)/info/attributes"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        before=$(git rev-parse HEAD)
        git merge --no-ff --no-edit "upstream/$BASE_BRANCH"
        git push origin "HEAD:refs/heads/$TARGET_BRANCH"

        # Link the pushed commits in the run summary; the merge commit's full diff is large,
        # so its CHANGELOG.md diff gets its own link (GitHub's file anchor is the SHA-256 of the path)
        repo_url=$(git remote get-url origin)
        repo_url=${repo_url%.git}
        changelog_anchor=$(printf %s CHANGELOG.md | sha256sum | cut -d' ' -f1)
        commits=$(git log --first-parent --format=%H "$before..HEAD")
        {
          if [ -z "$commits" ]; then
            echo "No commit pushed."
          else
            echo "Commits:"
            for c in $commits; do
              echo "- $repo_url/commit/$c"
              if ! git diff --quiet "$c^" "$c" -- CHANGELOG.md; then
                echo "  - [CHANGELOG.md]($repo_url/commit/$c#diff-$changelog_anchor)"
              fi
            done
          fi
        } >> "$GITHUB_STEP_SUMMARY"
