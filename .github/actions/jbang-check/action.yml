name: 'JBang check'
description: 'Builds all JBang scripts and verifies the launchers support --help'
runs:
  using: 'composite'
  steps:
    - name: Generate JBang cache key
      id: cache-key
      shell: bash
      run: echo "cache_key=jbang-check-$(date +%Y-%m)" >> $GITHUB_OUTPUT
    - name: Cache JBang
      # Shared by the "JBang (main)" and "JBang (PR)" jobs - both build the same scripts,
      # so they resolve the same dependencies. A PR run restores the entry written on main.
      uses: actions/cache@v6
      with:
        path: ~/.jbang
        key: ${{ steps.cache-key.outputs.cache_key }}
        restore-keys:
          jbang-check-
    - name: Resolve //DEPS into the cached directory
      # JBang resolves script dependencies into ~/.m2, which is not cached here.
      shell: bash
      run: echo "JBANG_REPO=$HOME/.jbang/repository" >> "$GITHUB_ENV"
    - name: Setup JBang
      uses: jbangdev/setup-jbang@main
    - name: Build .jbang scripts
      shell: bash
      run: |
        for f in .jbang/*.java; do
          echo "Building $f..."
          jbang build --fresh "$f"
        done
    - name: Build jablib-examples JBang scripts
      shell: bash
      run: |
        for f in jablib-examples/jbang/*.java; do
          echo "Building $f..."
          jbang build --fresh "$f"
        done
    - name: JabKit launcher supports --help
      shell: bash
      run: jbang run --fresh .jbang/JabKitLauncher.java --help
    - name: JabLs launcher supports --help
      shell: bash
      run: jbang run --fresh .jbang/JabLsLauncher.java --help
    - name: JabSrv launcher supports --help
      shell: bash
      run: jbang run --fresh .jbang/JabSrvLauncher.java --help
